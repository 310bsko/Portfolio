<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur du serveur</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAFAFA;color:#09090B;font-family:system-ui,sans-serif;text-align:center;padding:1.5rem}
    p.code{font-size:4rem;font-weight:700;margin:0;color:#2563EB}
    h1{font-size:1.5rem;margin:.5rem 0}
    p{color:#52525B;margin:.5rem 0 1.5rem}
    a{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;background:#2563EB;color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">500</p>
    <h1>Une erreur est survenue</h1>
    <p>Le site rencontre un problème passager. Merci de réessayer dans un instant.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
