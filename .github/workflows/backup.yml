name: Sauvegarde

# Chaque lundi : purge des messages de plus de 12 mois, puis export du contenu du site.
# Les messages de contact (données personnelles) ne sont PAS dans la sauvegarde.
#
# Attention : sur un dépôt public, GitHub désactive les workflows planifiés après 60 jours
# sans activité. Vérifier une fois par mois que la dernière sauvegarde est récente ;
# un commit ou le bouton « Run workflow » relance la planification.
#
# Secrets à créer dans Settings > Secrets and variables > Actions :
#   DATABASE_URL (adresse « pooled » de Neon) et SECRET_KEY.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev
      - run: uv run python manage.py purger_messages
      - run: uv run python manage.py exporter --dossier sauvegardes
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-portfolio
          path: sauvegardes/
          retention-days: 90
